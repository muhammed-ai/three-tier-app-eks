apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: three-tier-app-prod

resources:
  - ../base

nameSuffix: -prod

commonLabels:
  environment: production

patchesStrategicMerge:
  - patches/replica-patch.yaml
  - patches/resource-limits.yaml
  - patches/hpa-patch.yaml

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
      - NODE_ENV=production
